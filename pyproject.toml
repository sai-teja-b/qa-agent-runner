[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent-runner"
version = "0.1.0"
description = "Control loop for a QA agent: task spec, tools, one agent step, one judge, and a rerunnable score."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qa-agent-runner = "qa_agent_runner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
